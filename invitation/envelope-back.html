<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Envelope — back</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* --- the sealed side ----------------------------------------------------
     Flap across the top, the tea-shop photo on the body below it, and a gold
     seal sitting on the fold the way a wax seal would.
     --------------------------------------------------------------------- */

  /* the photo lives on .sheet (not .inner) so it runs into the bleed */
  .photo {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* A band, not a full bleed — it should read as a memory surfacing through
     the plum, and it has to clear the line-art at the foot. */
  .photo img {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    width: 100%;
    height: 30%;
    object-fit: cover;
    object-position: 50% 44%;
    display: block;
    opacity: 0.84;
    /* one radial layer rather than two linear ones — multi-layer
       mask-composite: intersect did not survive the renderer */
    mask-image: radial-gradient(
      ellipse 49% 64% at 50% 46%,
      #000 52%,
      rgba(0, 0, 0, 0.92) 74%,
      transparent 100%
    );
  }

  /* --- flap -------------------------------------------------------------- */

  .flap {
    position: absolute;
    inset: 0;
    z-index: 1;
    clip-path: polygon(0 0, 100% 0, 100% 29%, 50% 47%, 0 29%);
    /* a shade lighter than the body it lies on, and casting onto it, so the
       fold reads as a physical flap rather than a printed triangle */
    background:
      radial-gradient(120% 96% at 50% -22%, #45264f 0%, #33193d 34%, #26132e 66%, #1b0f21 100%);
    filter: drop-shadow(0 7px 12px rgba(0, 0, 0, 0.62));
  }

  .flap::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  /* the fold, drawn as a hairline that follows the flap's edge */
  .flap-edge {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .flap-edge svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- content ----------------------------------------------------------- */

  .content {
    position: absolute;
    inset: 0;
    z-index: 3;
  }

  .flap-type {
    position: absolute;
    top: 286px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .flap-type .names-sm {
    font-family: var(--font-script);
    font-size: 56px;
    color: var(--gold-bright);
    line-height: 1.06;
  }
    .flap-type .names-sm { gap: 0.15em; }
  .flap-type .names-sm .amp { font-size: 0.66em; }

  .flap-type .sub {
    font-size: 11px;
    letter-spacing: 0.44em;
    color: rgba(198, 165, 216, 0.82);
    margin-top: 18px;
  }

  /* the seal straddles the point of the flap */
  .seal {
    position: absolute;
    top: 47%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold-bright);
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
  }

  /* the seal disc is opaque in the SVG itself now, so it needs only a soft
     shadow under it rather than a painted backing */

  /* --- the foot ---------------------------------------------------------- */

  .foot {
    position: absolute;
    left: 84px;
    right: 84px;
    bottom: 62px;
    text-align: center;
  }

  .foot .backwater {
    color: var(--gold-bright);
    opacity: 0.72;
  }

  .foot .place {
    font-size: 11px;
    letter-spacing: 0.42em;
    color: var(--champagne);
    margin-top: 14px;
  }
</style>
</head>
<body>
<div class="sheet envelope">
  <div class="photo">
    <img src="assets/candid.jpg" alt="">
  </div>

  <div class="flap"></div>

  <div class="flap-edge">
    <svg viewBox="0 0 1008 1392" preserveAspectRatio="none" fill="none">
      <path d="M0,0 H1008 V404 L504,654 L0,404 Z"
            stroke="rgba(203,162,77,0.62)" stroke-width="2"
            vector-effect="non-scaling-stroke"/>
      <path d="M0,393 L504,643 L1008,393"
            stroke="rgba(232,205,130,0.26)" stroke-width="1.5"
            vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <div class="inner content">
    <div class="kasavu-band top"></div>

    <div class="flap-type">
      <p class="names-sm pair"><span class="bride">Keerthy</span><span class="amp">&amp;</span><span class="groom">Abhijith</span></p>
      <p class="label sub">12 December 2026</p>
    </div>

    <span class="motif seal" data-motif="ganapatiSeal" data-w="176"></span>

    <div class="foot">
      <span class="motif backwater" data-motif="backwater" data-w="1000"></span>
      <p class="label place">Thiruvalla &middot; Kerala</p>
    </div>
  </div>
</div>
<script src="motifs.js"></script>
</body>
</html>
